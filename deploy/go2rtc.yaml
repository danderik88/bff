api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: ":8554"
  username: "${BFF_RTSP_USER}"
  password: "${BFF_RTSP_PASS}"
webrtc:
  listen: ":8555"
log:
  level: warn
# The MJPEG printers (A1, P1) send ~1.5 frames/s with no timestamps: HA and ffmpeg viewers then probed
# 30-70 s before the first frame. Wall-clock timestamps and a steady 10 fps bring it under 5 s.
# Only http sources (BFF's /stream/) use these; RTSP printers pass through untouched.
ffmpeg:
  http: "-fflags nobuffer -flags low_delay -use_wallclock_as_timestamps 1 -i {input}"
  h264: "-c:v libx264 -r:v 10 -g:v 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
  # Klipper webcams mounted turned or mirrored (Moonraker's flip/rotation as EXIF Orientation 2..8).
  # go2rtc refuses #raw from its API, so the filters live here.
  h264_o2: "-vf hflip -c:v libx264 -r:v 10 -g:v 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
  h264_o3: "-vf hflip,vflip -c:v libx264 -r:v 10 -g:v 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
  h264_o4: "-vf vflip -c:v libx264 -r:v 10 -g:v 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
  h264_o5: "-vf transpose=0 -c:v libx264 -r:v 10 -g:v 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
  h264_o6: "-vf transpose=1 -c:v libx264 -r:v 10 -g:v 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
  h264_o7: "-vf transpose=3 -c:v libx264 -r:v 10 -g:v 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
  h264_o8: "-vf transpose=2 -c:v libx264 -r:v 10 -g:v 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
